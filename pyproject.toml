[project]
name = "deeplss-forecast-workspace"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "simple-slurm", 
]


[dependency-groups]
dev = [
    "ipython",
    "jupyterlab",
    "pytest",
    "ruff",
    "ipykernel",
    "pudb",
    "memory-profiler"
]


[tool.uv.workspace]
members = [
    "repos/euclid-cosmogridv11",
    "repos/euclid-deep-lss",
    "repos/euclid-multiprobe-simulation-forward-model",
    "repos/euclid-multiprobe-simulation-inference",
    "repos/FAST-PT",
    "repos/UFalcon",
]

