[project]
name = "deeplss-forecast-workspace"
version = "0.1.0"
requires-python = ">=3.10,<3.13"

dependencies = [
    "simple-slurm", 
    "pybind11",
]

[dependency-groups]
dev = [
    "ipython",
    "jupyterlab",
    "pytest",
    "ruff",
    "ipykernel",
    "pudb",
    "memory-profiler",
]

build = [
    "scikit-build-core",
    "cmake",
    "ninja",
    "setuptools",
    "wheel",
]


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.workspace]
members = [
    "repos/euclid-cosmogridv11",
    "repos/euclid-multiprobe-deeplss-training",
    "repos/FAST-PT",
    "repos/UFalcon",
    "repos/pyracorr",
]

[tool.uv.sources]
deepsphere = { workspace = true }
pyracorr = { workspace = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.uv]
no-build-isolation-package = ["torch-harmonics", "cuhpx"]
override-dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
]

