[project]
name = "deeplss-forecast-workspace"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "simple-slurm", 
]


[dependency-groups]
dev = [
    "ipython",
    "jupyterlab",
    "pytest",
    "ruff",
    "ipykernel",
    "pudb",
    "memory-profiler",
    "tensorboard",
    "torch_tb_profiler",
]

build = [
    "scikit-build-core",
    "cmake",
    "ninja",
    "setuptools",
    "wheel",
]


[tool.uv.workspace]
members = [
    "repos/euclid-cosmogridv11",
    "repos/euclid-multiprobe-deeplss-training",
    "repos/FAST-PT",
    "repos/UFalcon",
    "repos/pyracorr",
]


[tool.uv]
no-build-isolation-package = ["torch-harmonics", "cuhpx"]
override-dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
]

[tool.uv.sources]
pyracorr = { workspace = true }

