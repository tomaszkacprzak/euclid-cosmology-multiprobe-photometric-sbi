[project]
name = "deeplss-forecast-workspace"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "simple-slurm", 
    "pybind11",
]


[dependency-groups]
dev = [
    "ipython",
    "jupyterlab",
    "pytest",
    "ruff",
    "ipykernel",
    "pudb",
    "memory-profiler",
    "tensorboard",
    "torch_tb_profiler",
]

build = [
    "scikit-build-core",
    "cmake",
    "ninja",
    "setuptools",
    "wheel",
]


[tool.uv.workspace]
members = [
    "repos/euclid-cosmogridv11",
    "repos/euclid-multiprobe-deeplss-training",
    "repos/euclid-multiprobe-simulation-forward-model",
    "repos/euclid-multiprobe-simulation-inference",
    "repos/FAST-PT",
    "repos/UFalcon",
    "repos/deepsphere-cosmo-pytorch",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
cuhpx = { workspace = true }
deepsphere = { workspace = true }
torch-harmonics = { index = "torch-harmonics-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "torch-harmonics-cu128"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv]
no-build-isolation-package = ["cuhpx"]
override-dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "torch-harmonics"
]

