[workspace]
authors = ["Tom Ka"]
channels = ["conda-forge", "nvidia"]
name = "deeplss-forecast"
platforms = [
  { platform = "linux-64", cuda = "12.8" },
]
version = "0.1.0"


[dependencies]
python = ">=3.10"
cuda-version = "12.8.*"
cuda-nvcc = "12.8.*"
cuda-nvtx = "12.8.*"
cuda-cudart-dev = "*"
cuda-libraries-dev = "*"
cmake = "<4"
ninja = "*"
make = "*"
pkg-config = "*"
openmpi = "*"
hdf5 = { version = "*", build = "mpi_openmpi_*" }
h5py = { version = "*", build = "mpi_openmpi_*" }
mpi4py = "*"
fftw = { version = "*", build = "mpi_*" }
gsl = "*"
mpi = "*"
compilers = "*"
squashfuse = "*"
fuse-overlayfs = "*"
tensorflow-gpu = "*"
uv = "*"
scikit-build-core = ">=0.10"
ipython = "*"


[tasks]
uv-lock = { cmd = "uv lock" }


uv-sync = {

  cmd = "uv sync --all-packages --all-groups --all-extras --reinstall",
  env = {
    TORCH_CUDA_ARCH_LIST = "9.0",
    CUDA_HOME = "$CONDA_PREFIX/targets/x86_64-linux",
    CUDA_ROOT = "$CONDA_PREFIX/targets/x86_64-linux",
    CUDA_PATH = "$CONDA_PREFIX/targets/x86_64-linux",
    CUDAToolkit_ROOT = "$CONDA_PREFIX/targets/x86_64-linux",
    CUDA_TOOLKIT_ROOT_DIR = "$CONDA_PREFIX/targets/x86_64-linux",
    CUDA_INCLUDE_DIRS = "$CONDA_PREFIX/targets/x86_64-linux/include",
    CUDA_INC_DIR = "$CONDA_PREFIX/targets/x86_64-linux/include",
    CUDACXX = "$CONDA_PREFIX/bin/nvcc",
    CMAKE_CUDA_COMPILER = "$CONDA_PREFIX/bin/nvcc",
    CMAKE_PREFIX_PATH = "$PWD/.venv/lib/python3.10/site-packages/torch;$CONDA_PREFIX/targets/x86_64-linux;$CONDA_PREFIX;$CMAKE_PREFIX_PATH",
    LD_LIBRARY_PATH = "$PWD/.venv/lib/python3.10/site-packages/torch/lib:$CONDA_PREFIX/targets/x86_64-linux/lib:$CONDA_PREFIX/lib:$CONDA_PREFIX/lib64:$LD_LIBRARY_PATH",
    SKBUILD_CMAKE_ARGS = "-DCUDAToolkit_ROOT=$CONDA_PREFIX/targets/x86_64-linux;-DCUDA_TOOLKIT_ROOT_DIR=$CONDA_PREFIX/targets/x86_64-linux;-DCUDA_INCLUDE_DIRS=$CONDA_PREFIX/targets/x86_64-linux/include;-DCUDA_CUDART_LIBRARY=$CONDA_PREFIX/targets/x86_64-linux/lib/libcudart.so;-DCMAKE_CUDA_COMPILER=$CONDA_PREFIX/bin/nvcc;-DTORCH_CUDA_ARCH_LIST=9.0"
  }

}